name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Block private data files
        run: node scripts/check-no-data.mjs --all
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
